name: Python portability

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  resolver:
    name: Python paths and manifests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python_platform: linux
          - os: windows-latest
            python_platform: windows
          # Native arm64 runner for venv discovery. The manifest check pins
          # uv to the documented macOS 14 floor, so the runner image can move.
          - os: macos-15
            python_platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: 0.11.28
          enable-cache: true
          cache-dependency-glob: requirements/**/*.txt
          cache-suffix: python-portability
      - run: bun install --frozen-lockfile
      - name: Create native Python environment
        run: uv venv .ci-native-venv --python 3.11
      - name: Install VibeVoice source smoke without model wheels
        run: |
          uv pip install --python .ci-native-venv --no-deps -r requirements/vibevoice-sources.txt
          uv pip install --python .ci-native-venv -r requirements/vibevoice-server.txt
      - name: Test native venv discovery and launch
        run: bun test --timeout 30000 tests/platform/python.test.ts tests/platform/python-native.test.ts
        env:
          CICERO_NATIVE_VENV: ${{ github.workspace }}/.ci-native-venv
      - name: Resolve Python manifests without installing model wheels
        run: bun scripts/check-python-manifests.ts --platform ${{ matrix.python_platform }}
